[tool.poetry]
name = "api-python-weeviltrak"
version = "0.1.0"
description = "WeevilTrak ML prediction pipeline for boll weevil life-stage forecasting"
authors = ["Syngenta Digital <digital@syngenta.com>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
pandas = "^2.1.4"
numpy = "^1.25.2"
scikit-learn = "^1.3.2"
joblib = "^1.3.2"
python-dotenv = "^1.0.0"
boto3 = "^1.34.0"
redshift-connector = "^2.1.0"
tqdm = "^4.66.0"
pyyaml = "^6.0.1"
pyreadr = "^0.5.0" 
tables = "^3.8.0"
geopandas = ">=1.1.1,<2.0.0"
shapely = "^2.0.0"
pyarrow = "^22.0.0"
ipykernel = "^7.1.0"
griddedweather = {path = "vendor/griddedweather", develop = true}
lightgbm = "^4.6.0"
tabulate = "^0.10.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"
pytest-cov = "^4.1.0"
black = "^23.11.0"
isort = "^5.12.0"
flake8 = "^6.1.0"
mypy = "^1.7.1"
pre-commit = "^3.6.0"
httpx = "^0.25.2"
nbconvert = "^7.16.6"
matplotlib = "^3.10.8"
plotly = "^6.5.0"
shap = "^0.49.0"
openpyxl = "^3.1.5"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
line_length = 88

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
