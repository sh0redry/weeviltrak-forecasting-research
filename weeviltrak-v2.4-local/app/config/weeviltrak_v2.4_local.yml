# Local filesystem profile for the canonical WeevilTrak v2.4 model.
# Model behavior and result definitions match v2.4; only I/O locations differ.
version: "v2.4-local"
model_type: "lightgbm"
resolution: "10by10"
target: "signed_days_to_event"
rolling_window_days: 14
training_window_years: 3
recent_label_coverage:
  enabled: true
  min_events_per_stage: 20
  min_distinct_years_per_stage: 2
  on_insufficient: "block_retraining"
canonical_events:
  enabled: true
  include_phase2_as_stage3: true
  include_derived_phase1: true
  exclude_placeholder_dates: true
  placeholder_month_day: "12-31"
  model_stage_ids: [1, 4, 2, 3]
manual_events:
  enabled: true
  include_in_training: true
  include_in_validation: true
features:
  - stage_id
  - cumu_gdd_air
  - rolling_gdd_air
  - rolling_humidity_mean_pct
  - cumu_precip_total_mm
  - doy
  - cumu_cdd_air
  - rolling_cdd_air
  - latitude
  - longitude
model_parameters:
  n_estimators: 200
  learning_rate: 0.05
  max_depth: 6
  num_leaves: 31
  min_child_samples: 20
  subsample: 0.8
  colsample_bytree: 0.8
  random_state: 42
  n_jobs: 5
  monotone_constraints_by_feature:
    cumu_gdd_air: -1
post_event_training_days: 10
zero_day_termination_threshold: 1.0
zero_day_termination_consecutive_days: 2
termination_model:
  enabled: true
  type: "learned_ridge"
  training_window_years: 3
  alpha: 30.0
  threshold: 4.5
  overwrite_business_prediction: true
  min_history_days: 7
  training_source: "oof_trajectories"
  trajectory_start_month_day: "03-01"
  trajectory_end_month_day: "06-30"
  model_path: "outputs/local/artifacts/termination_model.pkl"
model_path: "outputs/local/artifacts/base_model.pkl"
hindcast_model_path: "outputs/local/artifacts/base_model.pkl"
output_path: "outputs/local/predictions"
data_source:
  mode: "local"
  events: "data_exports/v24_redshift_training_events_2026-08-21/v24_canonical_training_event_labels_2023-08-21_to_2026-08-21.csv"
  engineered_features: "data/local/engineered_daily_features.parquet"

